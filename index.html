<!-- index.html — Version 1.1 -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="LifeGame — перестань наблюдать. Начни играть. Запуск 1 января 2027 года.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>LifeGame — запуск 01.01.2027</title>
  <style>
    /* index.html — Version 1.1 */
    :root {
      color-scheme: dark;
      --background: #050505;
      --text: #f7f5f1;
      --muted: #8c8882;
      --orange: #ff7900;
      --amber: #ffb12b;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { min-height: 100%; background: var(--background); }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 39%, rgba(255, 103, 0, .105) 0%, rgba(255, 103, 0, .035) 25%, transparent 54%),
        radial-gradient(ellipse at 50% 105%, rgba(255, 87, 0, .07) 0%, transparent 48%),
        var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      position: relative;
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
      isolation: isolate;
    }

    .ambient {
      position: absolute;
      z-index: -1;
      top: 50%;
      left: 50%;
      width: min(78vw, 560px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 100, 0, .055);
      filter: blur(95px);
      transform: translate(-50%, -58%);
      pointer-events: none;
    }

    .content {
      display: flex;
      width: 100%;
      max-width: 680px;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: arrive 1100ms cubic-bezier(.2,.7,.2,1) both;
    }

    .wordmark {
      margin: 0;
      font-size: clamp(38px, 10vw, 70px);
      font-weight: 650;
      line-height: .98;
      letter-spacing: -.065em;
      text-transform: uppercase;
      background: linear-gradient(100deg, #fff2d9 2%, #ffb32c 48%, #ff6a00 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 38px rgba(255, 113, 0, .08);
    }

    .tagline {
      margin: clamp(34px, 7vh, 58px) 0 0;
      font-size: clamp(25px, 5.8vw, 42px);
      font-weight: 650;
      line-height: 1.16;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .tagline span {
      display: block;
      margin-top: 3px;
      background: linear-gradient(100deg, #fff2d9 4%, #ffb32c 48%, #ff6a00 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .launch-label {
      margin: clamp(36px, 7vh, 54px) 0 0;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .25em;
      text-indent: .25em;
      text-transform: uppercase;
    }

    .launch-date {
      margin: 13px 0 0;
      font-size: clamp(17px, 4vw, 21px);
      font-weight: 550;
      letter-spacing: .18em;
      text-indent: .18em;
      font-variant-numeric: tabular-nums;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      width: min(100%, 430px);
      gap: clamp(9px, 3vw, 22px);
      margin-top: 26px;
    }

    .time-unit { min-width: 0; }

    .time-value {
      display: block;
      color: #f6f2ec;
      font-size: clamp(27px, 6.6vw, 43px);
      font-weight: 520;
      line-height: 1;
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .time-label {
      display: block;
      margin-top: 11px;
      color: #77716a;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .footer {
      position: absolute;
      right: 20px;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #77716a;
      font-size: 10px;
      letter-spacing: .12em;
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 22px;
    }

    .footer-links a {
      color: #c1b8ad;
      text-decoration: none;
      text-underline-offset: 4px;
      transition: color 180ms ease;
    }

    .footer-links a:hover,
    .footer-links a:focus-visible {
      color: #ffad35;
    }

    .footer-links a:focus-visible {
      outline: 1px solid #ffad35;
      outline-offset: 4px;
      border-radius: 2px;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-height: 680px) {
      .wordmark { font-size: clamp(34px, 8vh, 52px); }
      .tagline { margin-top: 24px; font-size: clamp(23px, 5vh, 34px); }
      .launch-label { margin-top: 24px; }
      .countdown { margin-top: 19px; }
      .time-label { margin-top: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="tagline">
    <div class="ambient" aria-hidden="true"></div>
    <section class="content" aria-label="Анонс запуска LifeGame">
      <h1 class="wordmark" aria-label="LifeGame">LIFEGAME</h1>

      <h2 class="tagline" id="tagline">Перестань наблюдать.<span>Начни играть.</span></h2>

      <p class="launch-label">Старт проекта</p>
      <p class="launch-date">01.01.2027</p>

      <div class="countdown" role="timer" aria-label="Обратный отсчёт до запуска">
        <div class="time-unit"><span class="time-value" id="days">—</span><span class="time-label">Дней</span></div>
        <div class="time-unit"><span class="time-value" id="hours">—</span><span class="time-label">Часов</span></div>
        <div class="time-unit"><span class="time-value" id="minutes">—</span><span class="time-label">Минут</span></div>
        <div class="time-unit"><span class="time-value" id="seconds">—</span><span class="time-label">Секунд</span></div>
      </div>
    </section>

    <footer class="footer">
      <span>Новая игра начинается с тебя</span>
      <nav class="footer-links" aria-label="Проекты Raymondovich">
        <a href="https://raymondovich.ru" target="_blank" rel="noopener noreferrer">raymondovich.ru</a>
        <a href="https://raymondovich.online" target="_blank" rel="noopener noreferrer">raymondovich.online</a>
      </nav>
    </footer>
  </main>

  <script>
    // index.html — Version 1.1
    (() => {
      const target = new Date("2027-01-01T00:00:00+03:00").getTime();
      const fields = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds")
      };
      const pad = value => String(value).padStart(2, "0");

      function updateCountdown() {
        const remaining = Math.max(0, target - Date.now());
        const totalSeconds = Math.floor(remaining / 1000);
        fields.days.textContent = String(Math.floor(totalSeconds / 86400));
        fields.hours.textContent = pad(Math.floor((totalSeconds % 86400) / 3600));
        fields.minutes.textContent = pad(Math.floor((totalSeconds % 3600) / 60));
        fields.seconds.textContent = pad(totalSeconds % 60);

        if (remaining === 0) {
          document.querySelector(".launch-label").textContent = "Мы запустились";
          document.querySelector(".countdown").setAttribute("aria-label", "LifeGame запущен");
          return false;
        }
        return true;
      }

      if (updateCountdown()) {
        const timer = window.setInterval(() => {
          if (!updateCountdown()) window.clearInterval(timer);
        }, 1000);
      }
    })();
  </script>
</body>
</html>
